# 游戏网关配置（Nginx）
# 作用：同一域名下既托管游戏静态资源(dist/)，又把 /api/ 反代到本地 Node 授权服务。
#       => 游戏页与 API 同源同源，避开 CORS 与“混合内容”拦截，WebXR 安全上下文也满足。
#
# 部署时由 setup-server.sh 把 __DOMAIN__ / __CERT__ / __KEY__ / __PORT__ 替换为实际值。

# ---- HTTP：仅用于 Let's Encrypt 挑战 + 全站跳转 HTTPS ----
server {
    listen 80;
    server_name __DOMAIN__;
    location /.well-known/acme-challenge/ { root /opt/dist; }   # 须与 certbot --webroot -w 的目录一致（当前 /opt/dist）
    location / { return 301 https://$host$request_uri; }
}

# ---- HTTPS：游戏 + API ----
server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 游戏静态资源（tools/build-obfuscate.mjs 产出的 dist/）
    root /opt/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;   # SPA 回退，刷新非根路由不 404
    }

    # 授权 + 内容下发 API（同源，无需 CORS）
    location /api/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
