<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="9q0bPBdgAG8VXv6UpBuHXb">
<head data-page-node-id="osng3BRrHnBNHbvDgUUceR">
  <meta charset="UTF-8" data-page-node-id="Gt5swwXvPnvmZmbQwz7H5n" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" data-page-node-id="tWUY438zAXxPz5BhQLDbMJ" />
  <title>WebXR 肉鸽打气球</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #app { display: block; width: 100vw; height: 100vh; }
    #hint {
      position: fixed; bottom: 18px; left: 0; right: 0; text-align: center;
      color: #fff; font-family: sans-serif; font-size: 13px; opacity: .75;
      text-shadow: 0 1px 3px #000; z-index: 5; pointer-events: none;
    }
    #enter-vr-btn {
      position: fixed; bottom: 54px; left: 50%; transform: translateX(-50%);
      z-index: 20; padding: 12px 30px; font-size: 17px; font-family: sans-serif;
      border: none; border-radius: 10px; background: #6c5ce7; color: #fff;
      cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.4);
    }
    #enter-vr-btn:disabled { opacity: .6; cursor: default; }

    /* ── VR 桌面镜像按钮（让 PC 显示器也能看到头显画面）── */
    #mirror-btn {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      z-index: 20; padding: 8px 22px; font-size: 14px; font-family: sans-serif;
      border: none; border-radius: 10px; background: #2d3436; color: #fff;
      cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.4);
    }

    /* ── 页内镜像预览 canvas（MIRROR.MODE='page' 时显示，替代独立弹出窗口）── */
    /* 全屏显示：inset:0 + object-fit:contain 把 16:9 画面等比铺满屏幕，不变形、不偏一角。 */
    #mirror-canvas {
      position: fixed; inset: 0; z-index: 50;
      width: 100vw; height: 100vh;
      object-fit: contain;                 /* 保持 16:9 比例，黑边留白，不拉伸 */
      display: none;                       /* 默认隐藏，mirror.open() 时显示 */
      background: #000;
      pointer-events: none;                /* 不挡交互 */
    }
    #mirror-label {
      position: fixed; top: 14px; right: 16px; z-index: 51;
      display: none; font: 12px/1 sans-serif; color: #fff;
      text-shadow: 0 1px 2px #000; pointer-events: none;
    }

    /* ── 顶部枪械模式切换按钮（预览界面）── */
    #gun-mode-btn {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 40; padding: 9px 20px; font-size: 14px; font-family: sans-serif; font-weight: 600;
      border: none; border-radius: 10px; background: #6c5ce7; color: #fff;
      cursor: pointer; box-shadow: 0 6px 18px rgba(0, 0, 0, .4); white-space: nowrap;
    }
    #gun-mode-btn.full { background: #00b894; }
    /* 特殊关居中按钮(3/9/12/15)已移除，全关卡入口统一用右侧 #level-panel 面板 */
    #status-msg {
      position: fixed; bottom: 304px; left: 0; right: 0; text-align: center;
      color: #ffd43b; font-family: sans-serif; font-size: 14px; z-index: 20;
      text-shadow: 0 1px 3px #000; display: none;
    }
    #status-msg.error { color: #ff6b6b; }

    /* ── 右侧关卡快捷进入面板 ── */
    #level-panel {
      position: fixed; right: 12px; top: 12px; z-index: 30;
      display: flex; flex-direction: column; gap: 6px;
      width: 118px; max-height: 92vh; overflow-y: auto;
      padding: 8px; border-radius: 12px;
      background: rgba(20, 20, 28, .82); border: 1px solid rgba(255, 255, 255, .12);
      font-family: sans-serif; color: #fff;
    }
    #level-panel h4 { margin: 0 0 2px; font-size: 12px; font-weight: 700; opacity: .9; text-align: center; letter-spacing: 1px; }
    .level-btn {
      pointer-events: auto; cursor: pointer; border: none; border-radius: 8px;
      padding: 7px 8px; font-size: 13px; font-weight: 600; color: #fff; text-align: left;
      background: #4b4b5e; box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
      display: flex; align-items: baseline; gap: 6px; line-height: 1.1;
    }
    .level-btn:hover { filter: brightness(1.12); }
    .level-btn.normal { background: #4b4b5e; }
    .level-btn.crisis { background: #2d4a8a; }
    .level-btn.laser  { background: #b8651f; }
    .level-btn.boss   { background: #9b7d2e; }
    .level-btn .num { font-weight: 800; font-size: 14px; }
    .level-btn .tag { font-size: 11px; opacity: .92; }

    /* ── 预览加载遮罩 + 进度条：所有全景天空就绪前覆盖全屏，闸门 Enter VR 按钮 ── */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 9999;   /* 低于 pagelog(10000)，调试日志仍可见 */
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, .92); color: #fff; font-family: sans-serif;
    }
    #loading-text {
      font-size: 15px; margin-bottom: 14px; text-shadow: 0 1px 3px #000;
    }
    #loading-bar {
      width: 46vw; max-width: 520px; height: 10px; border-radius: 6px;
      background: rgba(255, 255, 255, .15); overflow: hidden;
    }
    #loading-bar-fill {
      width: 0%; height: 100%; border-radius: 6px;
      background: linear-gradient(90deg, #6c5ce7, #00b894); transition: width .15s ease;
    }
    #loading-actions { display:flex; gap:12px; margin-top:18px; }
    #loading-actions button { padding:10px 18px; border:0; border-radius:8px; cursor:pointer; }
    #game-controls { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); z-index:45; display:flex; flex-wrap:wrap; justify-content:center; gap:8px; width:min(650px,80vw); color:white; font:12px sans-serif; }
    #game-controls button, #pause-panel button, #settings-dialog button { padding:8px 14px; border:0; border-radius:6px; cursor:pointer; }
    #performance-status { width:100%; text-align:center; text-shadow:0 1px 4px black; }
    #pause-panel { position:fixed; top:35%; left:50%; transform:translateX(-50%); z-index:100; background:#171923; padding:30px; border-radius:12px; color:white; text-align:center; font:20px sans-serif; }
    #pause-panel p { margin-bottom:20px; }
    #settings-dialog { margin:auto; padding:24px; border:1px solid #777; border-radius:12px; background:#171923; color:white; font:15px sans-serif; width:min(460px,90vw); }
    #settings-dialog::backdrop { background:#0009; }
    #settings-dialog label { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:16px 0; }
    #settings-dialog input, #settings-dialog select { width:160px; padding:6px; }
    .pagelog.collapsed { display:none; }

    /* ── 最高优先级页面日志：浏览器最左侧，占 1/4 面积 ── */
    .pagelog {
      position: fixed; left: 0; top: 0; width: 25vw; height: 100vh;
      z-index: 10000; display: flex; flex-direction: column;
      background: rgba(0, 0, 0, .84); color: #d8d8d8;
      font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
      border-right: 1px solid rgba(255,255,255,.12);
    }
    .pagelog-head {
      flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
      padding: 6px 10px; background: rgba(108, 92, 231, .9); color: #fff;
      font-weight: 700; cursor: default;
    }
    .pagelog-pause { font: 11px/1 ui-monospace, monospace; opacity: .92; cursor: pointer; user-select: none; }
    .pagelog-pause.on { color: #ffd43b; }
    .pagelog-body {
      flex: 1 1 auto; overflow-y: auto; padding: 6px 10px; white-space: pre-wrap; word-break: break-word;
    }
    .pagelog-line { padding: 1px 0; border-bottom: 1px solid rgba(255,255,255,.04); }
    .pagelog-line.lvl-info { color: #cfd8e3; }
    .pagelog-line.lvl-warn { color: #ffd43b; }
    .pagelog-line.lvl-error { color: #ff7675; font-weight: 700; }
    /* ── 正式包界面裁剪 + 功能裁剪（body.release，由 src/main.js 的 RELEASE_UI 添加）─────
       隐藏全部调试/自测入口：枪支模式、操作提示、右侧「关卡快捷」（选关）、页面运行日志。
       「暂停 / 继续 / 设置 / 日志 / 导出性能记录」与桌面「开始游戏」在 JS 侧**根本不创建**
       （见 src/ui/settings.js 与 src/ui/hud.js 的 devUI）；暂停 / 性能 / 日志**功能**本身
       也已关掉（见 src/main.js 的 RELEASE 判定与 focusPause、src/ui/pagelog.js 的 disable()）。
       !important 是为了压掉 applyVRGate() 写在 style.display 上的内联值。
       .pagelog 这条是兜底：即便有人手动展开，正式包里也不允许它出现。 */
    body.release #gun-mode-btn,
    body.release #hint,
    body.release #level-panel,
    body.release .pagelog { display: none !important; }
  </style>
  <!-- three.js 本地化：头显无需外网即可加载（去除 unpkg CDN 依赖，解决头显白屏进不去） -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
</head>
<body data-page-node-id="nBQ0CAb10JTEzvHleoJaAh">
  <canvas id="app" data-page-node-id="0WtrY2FglRztfkNbd3N0Ai"></canvas>
  <button id="gun-mode-btn" data-page-node-id="y2jCienA97YBGfpL4xm6FD">🔫 枪支：初始（1弹道 / 2发每秒）</button>
  <div id="status-msg" data-page-node-id="Xjhq4O5484crQLL14Upb4x"></div>
  <div id="loading-overlay" data-page-node-id="6hKsHhHEVHd7cdV6HEXhAK">
    <div id="loading-text" data-page-node-id="qBaNSEBLoLijzHHqrm2E1C">正在加载天空资源…</div>
    <div id="loading-bar" data-page-node-id="KZfIkJHDdvfacXgYZeH8di"><div id="loading-bar-fill" data-page-node-id="b639S2ZfkLPUE5bmM31fGP"></div></div>
  </div>
  <button id="enter-vr-btn" data-page-node-id="cdkBDFO7uUJG1azzAteMAK">🎈 进入 VR</button>
  <button id="mirror-btn">🖥 镜像</button>
  <!-- 页内镜像预览（MIRROR.MODE='page' 时由 mirror.js 显示；'popup' 模式不用） -->
  <canvas id="mirror-canvas"></canvas>

  <!-- 特殊关居中按钮已移除；全关卡入口见右侧 #level-panel -->
  <div id="level-panel" data-page-node-id="y7DMG7DQ7kgodBA9EhdqDn"><h4 data-page-node-id="9szUhKY8ALy09J58yoMTI0">关卡快捷</h4></div>
  <div id="hint" data-page-node-id="g4kGwiKzgMP51OoPeKeWgL">桌面：WASD 移动 · 鼠标看 · 左键射击 · F 技能 · P/Esc 暂停 | 头显：右摇杆移动 · 惯用手扳机射击 · 握柄技能 · 右手 A/B 暂停</div>
  <!-- 最高优先级页面日志：经典脚本优先加载，不依赖 three，可捕获黑屏类致命错误 -->
  <script src="./src/ui/pagelog.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
