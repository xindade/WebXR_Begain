<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WebXR 肉鸽打气球</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #app { display: block; width: 100vw; height: 100vh; }
    #hint {
      position: fixed; bottom: 18px; left: 0; right: 0; text-align: center;
      color: #fff; font-family: sans-serif; font-size: 13px; opacity: .75;
      text-shadow: 0 1px 3px #000; z-index: 5; pointer-events: none;
    }
    #enter-vr-btn {
      position: fixed; bottom: 54px; left: 50%; transform: translateX(-50%);
      z-index: 20; padding: 12px 30px; font-size: 17px; font-family: sans-serif;
      border: none; border-radius: 10px; background: #6c5ce7; color: #fff;
      cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.4);
    }
    #enter-vr-btn:disabled { opacity: .6; cursor: default; }
    #enter-vr-laser-btn {
      position: fixed; bottom: 104px; left: 50%; transform: translateX(-50%);
      z-index: 20; padding: 10px 22px; font-size: 15px; font-family: sans-serif;
      border: none; border-radius: 10px; background: #e17055; color: #fff;
      cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.4);
    }
    #enter-vr-laser-btn:disabled { opacity: .6; cursor: default; }
    #enter-vr-level9-btn {
      position: fixed; bottom: 154px; left: 50%; transform: translateX(-50%);
      z-index: 20; padding: 10px 22px; font-size: 15px; font-family: sans-serif;
      border: none; border-radius: 10px; background: #00b894; color: #fff;
      cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.4);
    }
    #enter-vr-level9-btn:disabled { opacity: .6; cursor: default; }
    #enter-vr-level15-btn {
      position: fixed; bottom: 204px; left: 50%; transform: translateX(-50%);
      z-index: 20; padding: 10px 22px; font-size: 15px; font-family: sans-serif;
      border: none; border-radius: 10px; background: #0984e3; color: #fff;
      cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.4);
    }
    #enter-vr-level15-btn:disabled { opacity: .6; cursor: default; }
    #enter-vr-level12-btn {
      position: fixed; bottom: 254px; left: 50%; transform: translateX(-50%);
      z-index: 20; padding: 10px 22px; font-size: 15px; font-family: sans-serif;
      border: none; border-radius: 10px; background: #fdcb6e; color: #2d3436;
      cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.4);
    }
    #enter-vr-level12-btn:hover { filter: brightness(1.08); }
    #enter-vr-level12-btn:disabled { opacity: .6; cursor: default; filter: none; }
    #status-msg {
      position: fixed; bottom: 304px; left: 0; right: 0; text-align: center;
      color: #ffd43b; font-family: sans-serif; font-size: 14px; z-index: 20;
      text-shadow: 0 1px 3px #000; display: none;
    }
    #status-msg.error { color: #ff6b6b; }

    /* ── 预览加载遮罩 + 进度条：所有全景天空就绪前覆盖全屏，闸门 Enter VR 按钮 ── */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 9999;   /* 低于 pagelog(10000)，调试日志仍可见 */
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, .92); color: #fff; font-family: sans-serif;
    }
    #loading-text {
      font-size: 15px; margin-bottom: 14px; text-shadow: 0 1px 3px #000;
    }
    #loading-bar {
      width: 46vw; max-width: 520px; height: 10px; border-radius: 6px;
      background: rgba(255, 255, 255, .15); overflow: hidden;
    }
    #loading-bar-fill {
      width: 0%; height: 100%; border-radius: 6px;
      background: linear-gradient(90deg, #6c5ce7, #00b894); transition: width .15s ease;
    }

    /* ── 最高优先级页面日志：浏览器最左侧，占 1/4 面积 ── */
    .pagelog {
      position: fixed; left: 0; top: 0; width: 25vw; height: 100vh;
      z-index: 10000; display: flex; flex-direction: column;
      background: rgba(0, 0, 0, .84); color: #d8d8d8;
      font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
      border-right: 1px solid rgba(255,255,255,.12);
    }
    .pagelog-head {
      flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
      padding: 6px 10px; background: rgba(108, 92, 231, .9); color: #fff;
      font-weight: 700; cursor: default;
    }
    .pagelog-pause { font: 11px/1 ui-monospace, monospace; opacity: .92; cursor: pointer; user-select: none; }
    .pagelog-pause.on { color: #ffd43b; }
    .pagelog-body {
      flex: 1 1 auto; overflow-y: auto; padding: 6px 10px; white-space: pre-wrap; word-break: break-word;
    }
    .pagelog-line { padding: 1px 0; border-bottom: 1px solid rgba(255,255,255,.04); }
    .pagelog-line.lvl-info { color: #cfd8e3; }
    .pagelog-line.lvl-warn { color: #ffd43b; }
    .pagelog-line.lvl-error { color: #ff7675; font-weight: 700; }
  </style>
  <!-- three.js 本地化：头显无需外网即可加载（去除 unpkg CDN 依赖，解决头显白屏进不去） -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="app"></canvas>
  <div id="status-msg"></div>
  <div id="loading-overlay">
    <div id="loading-text">正在加载天空资源…</div>
    <div id="loading-bar"><div id="loading-bar-fill"></div></div>
  </div>
  <button id="enter-vr-btn">🎈 进入 VR</button>
  <button id="enter-vr-laser-btn">🎯 进入 VR · 第三关（激光）</button>
  <button id="enter-vr-level9-btn">🚀 进入 VR · 第九关（激光驱赶）</button>
  <button id="enter-vr-level15-btn">🎯 进入 VR · 第十五关（九宫格翻转）</button>
  <button id="enter-vr-level12-btn">🐉 进入 VR · 第十二关（龙 Boss）</button>
  <div id="hint">桌面：WASD 移动 · 鼠标看 · 左键射击 · F 放大招 · 点击画面锁定鼠标 | 头显：摇杆移动 · 扳机射击 · 握柄放大招 · A/B 退出</div>
  <!-- 最高优先级页面日志：经典脚本优先加载，不依赖 three，可捕获黑屏类致命错误 -->
  <script src="./src/ui/pagelog.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
